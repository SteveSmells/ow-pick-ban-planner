${pk?`<div class="card" style="margin-top:8px"><div class="row"><b>Choose ${pk.t==='ban'?'ban #'+(pk.i+1):'enemy '+pk.r}</b><button class="b" data-a="slot" data-v="">✕</button></div><div class="rl" style="flex-wrap:wrap;margin-top:6px">${S.heroes.filter(h=>pk.r==='ALL'||h.role===pk.r).map(h=>`<button class="b" data-a="assign" data-v="${esc(h.name)}">${esc(h.name)}</button>`).join('')}</div></div>`:''}
<div style="text-align:right;margin-top:10px"><button class="b p" data-a="close">Apply to top 3</button></div>`)}

// ---------- ACTIONS ----------
function toggleBan(n){const i=S.bans.indexOf(n);if(i>-1)S.bans[i]=null;else{let e=S.bans.indexOf(null);S.bans[e<0?3:e]=n}S.enemy=S.enemy.map(x=>x===n?null:x)}
function setEnemy(n){const h=S.heroes.find(x=>x.name===n);if(!h)return;if(S.enemy.includes(n)){S.enemy=S.enemy.map(x=>x===n?null:x);return}
if(h.role==='TANK')S.enemy[0]=n;else if(h.role==='DAMAGE'){if(!S.enemy[1])S.enemy[1]=n;else S.enemy[2]=n}else{if(!S.enemy[3])S.enemy[3]=n;else S.enemy[4]=n}}

step:v=>S.step=+v,rank:v=>{S.rank=v;S.step=2},
role:v=>{S.role=v;if(S.prof.auto&&v!=='ALL'&&S.prof.ranks[v])S.rank=S.prof.ranks[v];S.step=3},
map:v=>{S.map=v;S.step=4},mode:v=>S.mode=v,modal:v=>S.modal=v,close:()=>{S.modal=null;S.picker=null},
ban:v=>toggleBan(v),banclose:v=>{toggleBan(v);S.modal=null},enemyclose:v=>{setEnemy(v);S.modal=null},
comfort:()=>{S.prof.comfort=!S.prof.comfort;save()},
reset:()=>{S.bans=[null,null,null,null];S.enemy=[null,null,null,null,null];S.step=1},
main:v=>{const m=S.prof.mains,i=m.indexOf(v);if(i>-1)m.splice(i,1);else m.push(v);save()},
pf:v=>S.pf=v,
preset:v=>S.enemy=[...PRESETS[+v][1]],clear:()=>{S.bans=[null,null,null,null];S.enemy=[null,null,null,null,null]},
slot:v=>{if(!v){S.picker=null;return}const p=v.split(':');S.picker={t:p[0],i:+p[1],r:p[2]}},
assign:v=>{const k=S.picker;if(!k)return;const arr=k.t==='ban'?S.bans:S.enemy;const o=arr.indexOf(v);if(o>-1)arr[o]=null;arr[k.i]=v;if(k.t==='ban')S.enemy=S.enemy.map(x=>x===v?null:x);S.picker=null},

try{const[h,m,ro]=await Promise.allSettled([fetch(OF+'/heroes').then(r=>r.json()),fetch(OF+'/maps').then(r=>r.json()),fetch(OF+'/roles').then(r=>r.json())]);
if(h.status==='fulfilled'&&Array.isArray(h.value)){h.value.forEach(i=>{if(i.portrait){PORT[nk(i.key)]=i.portrait;PORT[nk(i.name)]=i.portrait}
if(i.key&&i.name&&i.role&&!heroByKey(i.key)&&!heroByKey(i.name)){const r=String(i.role).toUpperCase();S.heroes.push({id:nk(i.key),name:i.name,role:['TANK','DAMAGE','SUPPORT'].includes(r)?r:'DAMAGE',sub:'Live roster hero',wr:50.5,pr:5,br:2.5,aff:[6,6,6],rw:[8,8,8,8],perk:'Season 5 loadout',syn:['Doctrine','D.Mon','Vendetta'],ctr:['Sombra','Tracer'],str:['Reinhardt','Orisa']})}})}
if(h.status==='fulfilled'&&Array.isArray(h.value)){const ks=new Set();h.value.forEach(i=>{ks.add(nk(i.key));ks.add(nk(i.name))});S.heroes.forEach(x=>{x.live=ks.has(nk(x.id))||ks.has(nk(x.name))});S.rosterOK=true}
if(ro.status==='fulfilled'&&Array.isArray(ro.value))ro.value.forEach(i=>{if(i.key&&i.icon)ROLEIMG[String(i.key).toLowerCase()]=i.icon});
if(m.status==='fulfilled'&&Array.isArray(m.value))m.value.forEach(i=>{if(i.screenshot){MAPIMG[nk(i.name)]=i.screenshot;if(i.key)MAPIMG[nk(i.key)]=i.screenshot}});
R()}catch(e){}}
async function syncProfile(silent){
const tag=S.prof.tag.trim(),slug=tag.replace('#','-'),P=S.prof;
if(!/.+#\d+/.test(tag)){S.ps={st:'error',msg:'Enter your BattleTag as Name#12345.'};R();return}
S.ps={st:'checking',msg:'Checking OverFast for '+tag+'…'};R();
const now=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
try{
const r=await fetch(OF+'/players/'+encodeURIComponent(slug)+'/summary');
if(r.status===404){S.ps={st:'unindexed',msg:'Not found (404). Your profile is Friends Only/Private in-game, or OverFast hasn’t indexed it yet. Set it to Public and check again.'};R();return}
if(!r.ok){S.ps={st:'error',msg:'OverFast returned HTTP '+r.status+'. Try again shortly.'};R();return}
const d=await r.json();
P.avatar=d.avatar||P.avatar;P.title=d.title||P.title;
if(d.privacy==='private'||!d.competitive){S.ps={st:'private',msg:'Profile found but private. Ranks and hero stats stay hidden until Career Profile is Public.'};save();R();return}
const c=(d.competitive&&(d.competitive.pc||d.competitive.console))||{};
const rr={TANK:divToRank(c.tank&&c.tank.division),DAMAGE:divToRank(c.damage&&c.damage.division),SUPPORT:divToRank(c.support&&c.support.division)};
Object.keys(rr).forEach(k=>{if(rr[k])P.ranks[k]=rr[k]});
let n=0;
try{const sr=await fetch(OF+'/players/'+encodeURIComponent(slug)+'/stats/summary?gamemode=competitive');
if(sr.ok){const sd=await sr.json(),ent=[];P.pwr={};
Object.entries(sd.heroes||{}).forEach(([k,v])=>{const h=heroByKey(k);if(!h||!v)return;
if(typeof v.winrate==='number')P.pwr[h.id]=+v.winrate.toFixed(1);
if(typeof v.time_played==='number'&&v.time_played>0)ent.push([h.id,v.time_played])});
ent.sort((a,b)=>b[1]-a[1]);P.mains=ent.slice(0,6).map(e=>e[0]);n=P.mains.length;if(n)P.comfort=true}}catch(e){}
S.ps={st:'public',msg:'Public profile synced ('+now+'): '+n+' top heroes, role ranks updated.'};save();R()
}catch(e){S.ps={st:'error',msg:'Network error reaching OverFast. Check your connection and try again.'};R()}}
async function loadStats(){
try{const r=await fetch(OF+'/heroes/stats?platform=pc&gamemode=competitive&region='+encodeURIComponent(CFG.region)+'&order_by=hero:asc');
if(!r.ok)return{ok:false,msg:'OverFast hero stats returned HTTP '+r.status+'.'};
const j=await r.json(),arr=Array.isArray(j)?j:(j.data||j.heroes||[]);let n=0;
arr.forEach(u=>{const h=heroByKey(u.hero||u.key||u.name);if(!h)return;let c=false;
if(typeof u.winrate==='number'&&u.winrate>0&&u.winrate<100){h.wr=+u.winrate.toFixed(1);c=true}
if(typeof u.pickrate==='number'&&u.pickrate>=0&&u.pickrate<=100){h.pr=+u.pickrate.toFixed(1);c=true}
if(typeof u.banrate==='number'&&u.banrate>=0&&u.banrate<=100)h.br=+u.banrate.toFixed(1);
if(c)n++});
if(n){S.synced='Live · Blizzard stats ('+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})+')';save()}
return{ok:true,n}}catch(e){return{ok:false,msg:'Network error reaching OverFast.'}}}
async function doSync(){
if(S.busy)return;S.busy=true;R();
await hydrate();const r=await loadStats();
toast(r.ok?(r.n?'Updated '+r.n+' heroes from Blizzard’s hero stats.':'OverFast returned no hero stats right now.'):r.msg);
S.busy=false;R()}
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;if(t.classList.contains('mo')&&e.target!==t)return;
const a=t.dataset.a;if(!A[a])return;e.stopPropagation();const sc=document.querySelector('.sh')?.scrollTop;A[a](t.dataset.v);R();const sh=document.querySelector('.sh');if(sh&&sc&&S.modal)sh.scrollTop=sc});
document.addEventListener('input',e=>{const t=e.target;
if(t.id==='mq'){S.q=t.value;document.getElementById('maplist').innerHTML=mapList()}
else if(t.id==='pq'){S.pq=t.value;document.getElementById('plist').innerHTML=poolList()}
else if(t.dataset.wr){const v=parseFloat(t.value);if(!isNaN(v)){S.prof.pwr[t.dataset.wr]=Math.min(95,Math.max(25,v));save()}}
else if(t.dataset.stat){const[id,f]=t.dataset.stat.split(':'),v=parseFloat(t.value),h=S.heroes.find(x=>x.id===id);if(h&&!isNaN(v)){h[f]=v;S.synced='Custom patch';save()}}});
document.addEventListener('change',e=>{const t=e.target;
if(t.dataset.region){CFG.region=t.value;saveCfg();doSync()}
else if(t.dataset.rr){S.prof.ranks[t.dataset.rr]=t.value;if(S.role===t.dataset.rr)S.rank=t.value;save();R()}
else if(t.dataset.ck){S.prof[t.dataset.ck]=t.checked;save();R()}});
R();hydrate().then(loadStats).then(R);if(S.prof.tag)syncProfile(true);
</script></body></html>
