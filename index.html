<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OW Pick Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:ital,wght@1,700;1,800;1,900&display=swap" rel="stylesheet">
<style>
:root{--bg:#080b12;--pn:#0e1525;--p2:#151d31;--tx:#e8ecf4;--mu:#93a0b8;--ac:#f99e1a;--bd:#26324a;--gd:#34d399;--rd:#fb7185;--cy:#00e5ff;--ink:#0b0f19;color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(420px 420px at -5% -8%,rgba(249,158,26,.17),transparent 70%),radial-gradient(460px 460px at 105% 108%,rgba(0,229,255,.11),transparent 70%)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.05;background-image:radial-gradient(#f99e1a 1px,transparent 1px);background-size:28px 28px}
#app{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:10px}
h1,h2,h3{margin:0}h1,h2{font-size:26px;line-height:1.05}h3{font-size:17px}
button{font:inherit;color:inherit;cursor:pointer}
.nm,.ttl,.tag,.nav small{font-family:'Barlow Condensed','Arial Narrow',sans-serif}
.nm{font-weight:900;font-style:italic;text-transform:uppercase;letter-spacing:.03em}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;background:#0c111d;border:1px solid var(--bd);border-bottom:2px solid var(--ac);border-radius:12px;padding:8px 10px;margin-bottom:8px}
.crest{width:44px;height:44px;display:flex;align-items:center;justify-content:center;flex-shrink:0}.crest img,.crest svg{width:100%;height:100%;object-fit:contain}
.ttl{font-weight:900;font-style:italic;font-size:21px;line-height:1;letter-spacing:.06em;text-transform:uppercase;color:#fff}.ttl b{color:var(--ac)}
.sub{font-size:11px;color:var(--mu);margin-top:3px;display:flex;align-items:center}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;flex-shrink:0}.dot.pulse{animation:pl 1s ease-in-out infinite}
@keyframes pl{50%{opacity:.3}}@media(prefers-reduced-motion:reduce){.dot.pulse{animation:none}}
.b{background:#1a2338;border:1px solid var(--bd);border-radius:8px;padding:6px 10px;font-weight:700;font-size:12px}
.b:hover{border-color:var(--ac)}.b.p{background:var(--ac);color:var(--ink);border-color:var(--ac)}.b.r{color:var(--rd)}
.hd .b{clip-path:polygon(9% 0,100% 0,91% 100%,0 100%);border:0;border-radius:0;padding:8px 16px;font:italic 800 13px 'Barlow Condensed',sans-serif;letter-spacing:.09em;text-transform:uppercase;color:var(--cy);background:#172036}
.hd .b.p{background:var(--ac);color:var(--ink)}
.pill{display:flex;align-items:center;gap:7px;background:#0e1525;border:1px solid var(--bd);border-radius:10px;padding:3px 10px 3px 4px;text-align:left}
.pill.public{border-color:#10b981}.pill.checking{border-color:var(--cy)}.pill.off{border-color:#e11d48}
.pa{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--ac),#b45309);display:flex;align-items:center;justify-content:center;overflow:hidden;font-weight:900;color:var(--ink);font-size:12px;flex-shrink:0}.pa img{width:100%;height:100%;object-fit:cover}
.pill b{display:block;font:italic 800 14px/1 'Barlow Condensed',sans-serif;color:#fff;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pill small{display:block;font-weight:800;font-size:9px;line-height:1.3;letter-spacing:.08em;text-transform:uppercase}
.nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;margin-bottom:8px}
.nav button{clip-path:polygon(5% 0,100% 0,95% 100%,0 100%);background:var(--pn);border:0;padding:6px 12px;text-align:left;min-width:0;box-shadow:inset 0 -2px var(--bd)}
.nav .on{background:linear-gradient(90deg,rgba(249,158,26,.38),rgba(249,158,26,.07));box-shadow:inset 0 -3px var(--ac)}.nav .done{box-shadow:inset 0 -3px #10b981}
.nav small{display:block;font-size:11px;font-weight:900;font-style:italic;letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}.nav .on small{color:var(--ac)}.nav .done small{color:var(--gd)}
.nav span{font-size:12px;font-weight:700;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pn{background:rgba(14,21,37,.92);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:8px;min-width:0}
.g{display:grid;gap:8px}.g>*{min-width:0}.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}.g3{grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr))}
.card{background:#0a0f1b;border:1px solid var(--bd);border-radius:12px;padding:10px;text-align:left;width:100%;min-width:0}
.card:hover,.card.sel{border-color:var(--ac)}.card.sel{box-shadow:0 0 0 1px var(--ac)}
.tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:1px 7px;border-radius:5px;border:1px solid var(--bd);background:var(--p2);color:var(--cy);max-width:100%}
.tag.a{background:var(--ac);color:var(--ink);border-color:var(--ac)}.tag.d{color:var(--rd);border-color:rgba(251,113,133,.4);background:rgba(251,113,133,.1)}
.row{display:flex;align-items:center;gap:8px;justify-content:space-between}.rl{display:flex;align-items:center;gap:8px;min-width:0}
.mut{color:var(--mu);font-size:12px}.tr{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--mu);font-size:12px;line-height:1.3;min-height:2.6em}
.pk{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:8px;align-items:center;cursor:pointer}
.pk .tx{min-width:0}.pk .nr{display:flex;align-items:center;gap:4px;min-width:0}.pk .nr .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pk .nr .tag{flex-shrink:0}
.pk .st{display:flex;align-items:center;gap:8px;text-align:right}
@media(max-width:560px){.pk:not(.b4){grid-template-columns:auto auto minmax(0,1fr)}.pk:not(.b4) .st{grid-column:1/-1;justify-content:space-between;border-top:1px solid var(--bd);padding-top:6px}}
.av{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:12px;color:#fff;flex-shrink:0;position:relative;overflow:hidden;border:1px solid #475569}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top;border-radius:inherit}.av span{position:relative}
.TANK{background:linear-gradient(135deg,#2563eb,#0b1020)}.DAMAGE{background:linear-gradient(135deg,#e11d48,#0b1020)}.SUPPORT{background:linear-gradient(135deg,#059669,#0b1020)}
.ri{display:inline-flex;width:18px;height:18px;color:#fff;flex-shrink:0}.ri svg,.ri img{width:100%;height:100%}.ri img{filter:brightness(0) invert(1)}
.rib{width:50px;height:50px;border-radius:12px;background:#10192c;border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:11px}.rib .ri{width:100%;height:100%}
.TANKc{color:#60a5fa}.DAMAGEc{color:#fb7185}.SUPPORTc{color:#34d399}.ALLc{color:var(--ac)}
.wr{font-weight:900;font-size:17px;font-family:'Barlow Condensed',sans-serif;color:var(--gd);text-align:right}.wr.d{color:var(--rd)}
input,select{background:#0a0f1b;color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:6px 8px;font:inherit;max-width:100%}input:focus,select:focus{outline:2px solid var(--ac);outline-offset:1px}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.78);backdrop-filter:blur(3px);z-index:9;display:flex;align-items:flex-end;justify-content:center}
.sh{background:#0e1525;border:2px solid var(--ac);border-radius:18px 18px 0 0;width:100%;max-width:660px;max-height:90dvh;overflow:auto;padding:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
@media(min-width:700px){.mo{align-items:center;padding:16px}.sh{border-radius:18px}}
.pills{display:flex;gap:4px;overflow-x:auto;padding-bottom:4px}.pills .b{flex-shrink:0;padding:4px 11px;font-size:11px;text-transform:uppercase}
.on2{background:var(--ac)!important;color:var(--ink)!important;border-color:var(--ac)!important}
.mbg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.28;pointer-events:none}.card>*,.pn>*{position:relative}.card>.mbg,.pn>.mbg{position:absolute}
.ok{color:var(--gd)}.bad{color:var(--rd)}
.pt{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start}.pt .dev{border-left:3px solid var(--ac);padding:1px 0 1px 8px;margin:6px 0;color:var(--mu);font-size:13px;font-style:italic}.pt .ab{margin:8px 0 2px;font:italic 800 14px 'Barlow Condensed',sans-serif;letter-spacing:.04em;text-transform:uppercase;color:var(--cy)}.pt ul{margin:2px 0 0;padding-left:18px}.pt li{margin:3px 0;font-size:13px}.rolehd{display:flex;align-items:center;gap:8px;margin:14px 0 6px}.rolehd .ri{width:20px;height:20px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:#f4f6fb;color:#0b0f19;padding:8px 14px;border-radius:10px;font-size:13px;font-weight:600;z-index:20;max-width:90%}
</style>
</head><body><div id="app"></div>
<script>
'use strict';
const OF='https://overfast-api.tekrop.fr';
const KEY='ow_draft_v3';   // new key: anything typed in by hand in older versions is not carried over
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nk=x=>String(x||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');
const cap=s=>String(s||'').replace(/[-_]+/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
const f1=n=>(Math.round(n*10)/10).toFixed(1);
const sg=n=>(n>=0?'+':'−')+f1(Math.abs(n));
// ---------- state ----------
let D=null;                                  // data/meta.json written by the daily workflow
const LIVE={heroes:[],maps:[],roles:[],ok:false};   // live OverFast roster (new heroes/maps show up here first)
let H=[],M=[],RL=[],MAINS=new Set(),HB=new Map(),HX=new Map();   // merged heroes, maps, roles; hero lookups by key, name, normalised key/name
const S={chosen:null,step:1,rank:'all',role:'TANK',map:null,mode:'ALL',q:'',modal:null,insp:null,busy:false,loaded:false,
prof:{tag:'',comfort:true,auto:false,ranks:{},pwr:{},games:{},allGames:{},time:{}},ps:{st:'idle',msg:'Not checked yet.'}};
try{const v=JSON.parse(localStorage.getItem(KEY)||'null');if(v&&v.prof)['tag','comfort','auto','ranks','pwr','games','allGames','time','avatar'].forEach(k=>{if(v.prof[k]!==undefined)S.prof[k]=v.prof[k]})}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify({prof:S.prof}))}catch(e){}};
// No profile is built in. A BattleTag is only used once it has been typed in on this device (profile screen)
// or the page was opened once with ?tag=Name-12345. It is remembered on this device only.
const parseTag=v=>{const m=String(v||'').trim().match(/^(.+?)\s*[#-]\s*(\d{3,6})$/);return m?m[1].trim()+'#'+m[2]:''};
const clearSynced=()=>{const P=S.prof;P.ranks={};P.pwr={};P.games={};P.allGames={};P.time={};delete P.avatar};
try{const t=parseTag(new URLSearchParams(location.search).get('tag'));if(t){if(t!==S.prof.tag)clearSynced();S.prof.tag=t;history.replaceState(null,'',location.pathname);save()}}catch(e){}
if(!S.prof.tag)S.ps={st:'none',msg:'No BattleTag is connected on this device.'};
// ---------- data ----------
async function loadMeta(){
try{const r=await fetch('data/meta.json',{cache:'no-cache'});D=r.ok?await r.json():null}catch(e){D=null}}
async function loadLive(){
try{const[h,m,r]=await Promise.allSettled([fetch(OF+'/heroes').then(x=>x.json()),fetch(OF+'/maps').then(x=>x.json()),fetch(OF+'/roles').then(x=>x.json())]);
LIVE.ok=false;
if(h.status==='fulfilled'&&Array.isArray(h.value)){LIVE.heroes=h.value;LIVE.ok=true}
if(m.status==='fulfilled'&&Array.isArray(m.value))LIVE.maps=m.value;
if(r.status==='fulfilled'&&Array.isArray(r.value))LIVE.roles=r.value}catch(e){}}
function rebuild(){
const hm=new Map();
((D&&D.heroes)||[]).forEach(h=>hm.set(h.key,{key:h.key,name:h.name,role:String(h.role).toUpperCase(),portrait:h.portrait||'',fresh:false}));
LIVE.heroes.forEach(h=>{if(!h.key||!h.name||!h.role)return;const o=hm.get(h.key)||{key:h.key,name:h.name,role:'',portrait:'',fresh:!!D};o.name=h.name;o.role=String(h.role).toUpperCase();o.portrait=h.portrait||o.portrait;hm.set(h.key,o)});
H=[...hm.values()].filter(h=>h.name&&h.role).sort((a,b)=>a.name.localeCompare(b.name));
HB=new Map(H.map(h=>[h.key,h]));HX=new Map(H.flatMap(h=>[[nk(h.key),h],[nk(h.name),h]]));
const mm=new Map();
((D&&D.maps)||[]).forEach(m=>mm.set(m.key,{key:m.key,name:m.name,modes:m.modes||[],img:m.img||'',fresh:false}));
const modeSet=new Set([...mm.values()].flatMap(m=>m.modes));
const known=new Set((D&&D.knownMaps)||[]);   // every map the roster had at the last data run
LIVE.maps.forEach(m=>{const k=nk(m.name),modes=m.gamemodes||[],ex=mm.get(k);
if(ex){if(m.screenshot)ex.img=m.screenshot;if(!ex.modes.length)ex.modes=modes;return}
if(known.size&&!known.has(k)&&modeSet.size&&modes.some(x=>modeSet.has(x)))mm.set(k,{key:k,name:m.name,modes,img:m.screenshot||'',fresh:true})});
M=[...mm.values()].sort((a,b)=>a.name.localeCompare(b.name));
RL=(LIVE.roles.length?LIVE.roles:(D&&D.roles)||[]).map(r=>({id:String(r.key).toUpperCase(),name:r.name,desc:r.description||'',icon:r.icon||''}));
}
function defaults(){
const divs=(D&&D.divisions)||[];
if(!divs.some(d=>d.key===S.rank))S.rank=divs.length?divs[0].key:'all';
if(!M.some(m=>m.key===S.map))S.map=M.length?M[0].key:null;
if(RL.length&&S.role!=='ALL'&&!RL.some(r=>r.id===S.role))S.role=RL[0].id}
const hk=k=>HB.get(k);
// "Main" = your 3 most-played heroes in each role (all game modes). It is only a label; it never changes a score.
function topMains(){const out=new Set(),T=S.prof.time||{};RL.forEach(r=>H.filter(h=>h.role===r.id&&(T[h.key]||0)>0).sort((a,b)=>T[b.key]-T[a.key]).slice(0,3).forEach(h=>out.add(h.key)));return out}
const heroByKey=k=>HX.get(nk(k));
const chosenHero=()=>{const h=S.chosen&&hk(S.chosen);return h&&(S.role==='ALL'||h.role===S.role)?h:null};
const mapO=()=>M.find(m=>m.key===S.map)||null;
const divLabel=k=>{const d=((D&&D.divisions)||[]).find(x=>x.key===k);return d?d.label:cap(k)};
const rt=(h,d)=>{const r=D&&D.rates&&D.rates[d||S.rank];return r&&r[h.key]||null};
const mapRt=h=>{const m=D&&D.mapRates&&D.mapRates[S.map];return m&&m[h.key]||null};
const confR=pr=>pr/(pr+3);   // rarely played heroes count less: a few games swing their win rate
const confM=pr=>pr/(pr+8);   // a single map has far fewer games, so it needs more evidence
const mapDelta=h=>{const m=mapRt(h),a=rt(h,'all');return m&&a?(m[0]-a[0])*confM(m[1]):0};   // weighted map bonus, in points
const shrunk=r=>50+(r[0]-50)*confR(r[1]);   // rank win rate weighted by pick rate
const LBL={duel:'wins the 1v1',team:'team pressure',mixed:'mixed threat'};
// how much hero h counters enemy e: [rating,label] (positive = h counters e)
function ctr(h,e){const c=D&&D.counters;if(!c)return null;
const a=c[e.key]&&c[e.key][h.key];if(a)return a;
const b=c[h.key]&&c[h.key][e.key];if(b)return[-b[0],b[1]];return null}
// heroes that counter h (dir 1) or that h counters (dir -1), best first, using the matrix from either side
const matchups=(h,n,dir)=>H.map(x=>{const c=dir>0?ctr(x,h):ctr(h,x);return c&&c[0]>0?{h:x,r:c[0],l:c[1]}:null}).filter(Boolean).sort((a,b)=>b.r-a.r).slice(0,n);
const countersOf=(h,n)=>matchups(h,n,1),beatsOf=(h,n)=>matchups(h,n,-1);
// ---------- engine ----------
function recommend(){
if(!D||!D.rates)return[];
const P=S.prof;
const sc=[];
H.forEach(h=>{if(S.role!=='ALL'&&h.role!==S.role)return;
const r=rt(h);if(!r||r[1]<1)return;
const md=mapDelta(h);
const main=MAINS.has(h.key),pw=P.pwr[h.key],g=P.allGames[h.key]||0,cg=P.games[h.key]||0;
// Experience bonus (no cap on how many heroes qualify):
//  familiarity = 1.5 x games/(games+50), counting every game mode;
//  win-rate part = your ranked win rate minus the official rate at your rank (capped at +/-10), x0.25,
//  scaled by ranked games/(ranked games+25), and only once you have 20+ ranked games on the hero.
let cf=0,mb=null;
if(P.comfort&&g>0){const fam=1.5*g/(g+50);let edge=0,conf=0;if(cg>=20&&typeof pw==='number'){edge=Math.max(-10,Math.min(10,pw-r[0]));conf=cg/(cg+25)}cf=fam+edge*0.25*conf;mb={fam,edge,conf,g,cg}}
sc.push({h,r,md,main,pw,cf,mb,total:shrunk(r)+md+cf})});
sc.sort((a,b)=>b.total-a.total);
if(S.role==='ALL')return RL.map(ro=>sc.find(x=>x.h.role===ro.id)).filter(Boolean);
return sc.slice(0,3)}
function bansCalc(){
if(!D||!D.rates)return[];
const P=S.prof;
const ch=chosenHero(),T=ch?[ch]:[];
const out=[];
H.forEach(h=>{if(h===ch)return;
const r=rt(h);if(!r||r[1]<1)return;
let s=0,best=null;
T.forEach(t=>{const c=ctr(h,t);if(c&&c[0]>0){const v=c[0]/T.length;s+=v;if(!best||v>best.v)best={v,t:t.name,r:c[0],l:c[1]}}});
out.push({h,r,best,total:(0.5*s+(shrunk(r)+mapDelta(h)-50))*r[1]/(r[1]+5)})});   // (half the counter rating + win-rate edge) x how often the hero is played
out.sort((a,b)=>b.total-a.total);
return out.slice(0,3)}
function banReason(b){const p=[];
if(b.best)p.push('Counters '+(chosenHero()?'your ':'')+b.best.t+' ('+sg(b.best.r)+(b.best.l?', '+LBL[b.best.l]:'')+')');
p.push(f1(b.r[0])+'% win rate'+(mapO()?' here':'')+' at '+divLabel(S.rank));
if(!b.best)p.push(f1(b.r[1])+'% pick');
if(b.r[2]!=null)p.push(f1(b.r[2])+'% ban rate');
return p.join(' · ')}
function pickLines(x){const h=x.h,m=mapO(),L=[];
L.push('Official win rate at '+divLabel(S.rank)+': '+f1(x.r[0])+'% ('+f1(x.r[1])+'% pick'+(x.r[2]!=null?', '+f1(x.r[2])+'% ban':'')+').');
L.push('Scored on a sample-weighted win rate: at a '+f1(x.r[1])+'% pick rate its official number counts '+Math.round(confR(x.r[1])*100)+'% toward the score.');
const mr=mapRt(h);if(m&&mr)L.push('On '+m.name+': '+f1(mr[0])+'% across all ranks ('+f1(mr[1])+'% pick there). Counted as '+sg(x.md)+' points after weighting for sample size.');
if(x.mb){const m=x.mb,w=m.edge*0.25*m.conf;L.push('You have played this hero '+m.g+' games in all modes: '+sg(m.fam)+' for familiarity'+(m.conf>0?', '+sg(w)+' for your '+f1(x.pw)+'% ranked win rate vs. the '+f1(x.r[0])+'% official rate over '+m.cg+' ranked games (counted at '+Math.round(m.conf*100)+'% for sample size)':(m.cg>0?' (only '+m.cg+' ranked games, too few to count your win rate)':''))+'. Total '+sg(x.cf)+' points.')}
return L}
// ---------- view helpers ----------

const A={
step:v=>S.step=+v,rank:v=>{S.rank=v;S.step=2},
role:v=>{S.role=v;S.chosen=null;const pr=S.prof.ranks[v];if(S.prof.auto&&v!=='ALL'&&pr&&((D&&D.divisions)||[]).some(d=>d.key===pr))S.rank=pr;S.step=3},
map:v=>{S.map=v;S.step=4},mode:v=>S.mode=v,modal:v=>S.modal=v,close:()=>{S.modal=null},
choose:v=>{S.chosen=S.chosen===v?null:v},chooseclose:v=>{S.chosen=S.chosen===v?null:v;S.modal=null},
comfort:()=>{S.prof.comfort=!S.prof.comfort;save()},
reset:()=>{S.chosen=null;S.step=1},
insp:v=>{const[t,i]=v.split(':');const d=t==='pick'?recommend()[+i]:bansCalc()[+i];if(d){S.insp={type:t,i:+i,d};S.modal='insp'}},
resync:()=>{syncProfile()},
connect:()=>{const t=parseTag((document.getElementById('tagin')||{}).value);if(!t){toast('Enter your BattleTag as Name#12345.');return}
if(t!==S.prof.tag){clearSynced();S.prof.tag=t;S.ps={st:'checking',msg:'Checking…'}}save();syncProfile()},
disconnect:()=>{clearSynced();S.prof.tag='';S.ps={st:'none',msg:'No BattleTag is connected on this device.'};save()},};
async function loadAll(){
if(S.busy)return;S.busy=true;render();
await Promise.all([loadMeta(),loadLive()]);
rebuild();defaults();S.busy=false;S.loaded=true;render()}
// ---------- profile (live from OverFast) ----------
const OFP=OF+'/players/';
function toDiv(d){d=String(d||'');if(!d)return null;const x=((D&&D.divisions)||[]).find(v=>v.key!=='all'&&(nk(v.key)===nk(d)||nk(v.label)===nk(d)));return x?x.key:null}
async function syncProfile(){
if(!S.prof.tag)return;
const tag=S.prof.tag.trim(),slug=tag.replace('#','-'),P=S.prof;
if(!/.+#\d+/.test(tag)){S.ps={st:'error',msg:'Enter your BattleTag as Name#12345.'};render();return}
S.ps={st:'checking',msg:'Checking OverFast for '+tag+'…'};render();
const now=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
try{
const r=await fetch(OFP+encodeURIComponent(slug)+'/summary');
if(r.status===404){S.ps={st:'unindexed',msg:'Not found (404). Your profile is Friends Only/Private in-game, or OverFast hasn’t indexed it yet. Set it to Public and check again.'};render();return}
if(!r.ok){S.ps={st:'error',msg:'OverFast returned HTTP '+r.status+'. Try again shortly.'};render();return}
const d=await r.json();P.avatar=d.avatar||P.avatar;
if(d.privacy==='private'||!d.competitive){S.ps={st:'private',msg:'Profile found but private. Ranks and hero stats stay hidden until Career Profile is Public.'};save();render();return}
const c=(d.competitive&&(d.competitive.pc||d.competitive.console))||{};
P.ranks={};
RL.forEach(ro=>{const k=toDiv(c[ro.id.toLowerCase()]&&c[ro.id.toLowerCase()].division);if(k)P.ranks[ro.id]=k});
let n=0;
try{
const get=async gm=>{try{const r=await fetch(OFP+encodeURIComponent(slug)+'/stats/summary?gamemode='+gm);return r.ok?await r.json():null}catch(e){return null}};
const [cd,qd]=await Promise.all([get('competitive'),get('quickplay')]);
if(cd||qd){P.pwr={};P.games={};P.allGames={};P.time={};
const gp=v=>typeof v.games_played==='number'?v.games_played:(typeof v.games_won==='number'&&typeof v.games_lost==='number'?v.games_won+v.games_lost:0);
const add=(d,ranked)=>Object.entries((d&&d.heroes)||{}).forEach(([k,v])=>{const h=heroByKey(k);if(!h||!v)return;const g=gp(v);
P.allGames[h.key]=(P.allGames[h.key]||0)+g;P.time[h.key]=(P.time[h.key]||0)+(typeof v.time_played==='number'?v.time_played:0);
if(ranked){P.games[h.key]=g;if(typeof v.winrate==='number'&&g>0)P.pwr[h.key]=+v.winrate.toFixed(1)}});
add(cd,true);add(qd,false);n=Object.keys(P.allGames).filter(k=>P.allGames[k]>0).length}}catch(e){}
S.ps={st:'public',msg:'Public profile synced ('+now+'): '+n+' heroes played (ranked + quick play), role ranks updated.'};save();render()
}catch(e){S.ps={st:'error',msg:'Network error reaching OverFast. Check your connection and try again.'};render()}}
// ---------- events ----------
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.modal){S.modal=null;render()}else if(e.key==='Enter'&&e.target.id==='tagin'){A.connect();render()}});
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;if(t.classList.contains('mo')&&e.target!==t)return;
const a=t.dataset.a;if(!A[a])return;e.stopPropagation();const sc=document.querySelector('.sh')?.scrollTop;A[a](t.dataset.v);render();const sh=document.querySelector('.sh');if(sh&&sc&&S.modal)sh.scrollTop=sc});
document.addEventListener('input',e=>{const t=e.target;
if(t.id==='mq'){S.q=t.value;document.getElementById('maplist').innerHTML=mapList()}
});
document.addEventListener('change',e=>{const t=e.target;
if(t.dataset.ck){S.prof[t.dataset.ck]=t.checked;save();render()}});
// ---------- start ----------
render();
loadAll(false).then(()=>{if(S.prof.tag)syncProfile()});

</script></body></html>
