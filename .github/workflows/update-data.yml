name: Update data

on:
  schedule:
    - cron: '17 5 * * *'   # every day at 05:17 UTC
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Fetch data
        run: node scripts/update-data.mjs
        env:
          REGION: europe   # americas, europe or asia
      - name: Save data to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/meta.json
          if git diff --staged --quiet; then
            echo "No changes to save"
            exit 0
          fi
          git commit -m "Update data"
          # If you pushed something else while this run was going, pull it in and try again
          for attempt in 1 2 3 4; do
            if git push; then exit 0; fi
            echo "Push rejected (attempt $attempt); pulling the latest changes and retrying"
            git pull --rebase
            sleep 5
          done
          echo "::error::Could not push the data file after 4 attempts"
          exit 1
