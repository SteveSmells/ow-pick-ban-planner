name: Update data

on:
  schedule:
    - cron: '17 5 * * *'   # every day at 05:17 UTC
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch data
        run: node scripts/update-data.mjs
        env:
          REGION: europe   # americas, europe or asia
      - name: Save data to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/meta.json
          if git diff --staged --quiet; then
            echo "No changes to save"
          else
            git commit -m "Update data"
            git push
          fi
